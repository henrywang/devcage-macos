# tmux configuration for macOS (Ghostty) and Linux
# Palette mirrors ~/.config/vim/colors/ghostty-dark.vim

# ── Shell & terminal ───────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys,xterm-256color:RGB"

# Pass modified keys such as shift+enter through to Claude Code and pi
set -s extended-keys on
set -s extended-keys-format csi-u

# Short escape-time so <Esc> in vim and zsh vi-mode is not delayed
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S:#W"

# Ghostty supports OSC 52 (clipboard-write = allow), so yanks reach the system
# clipboard, also over ssh
set -s set-clipboard on

# ── Windows & panes ────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl-h/j/k/l moves between vim splits and tmux panes (pairs with vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl-l is taken by pane navigation, so prefix + Ctrl-l clears the screen
bind C-l send-keys C-l

# ── Copy mode (vi) ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
# Jump between shell prompts (OSC 133 marks emitted by .zshrc)
bind -T copy-mode-vi [ send -X previous-prompt
bind -T copy-mode-vi ] send -X next-prompt

# ── Theme: Ghostty Dark ────────────────────────────────────────────────────
# bg #1d1f21  fg #c5c8c6  grey #666666  blue #88a1bb  green #b7bd73
# yellow #e1c65e  red #c55757  purple #ad95b8
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1d1f21,fg=#c5c8c6"

set -g status-left-length 30
set -g status-left "#[bg=#88a1bb,fg=#1d1f21,bold] #S #[default] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#1d1f21 bg=#e1c65e bold] PREFIX #[default] ,}#[fg=#666666]%Y-%m-%d #[fg=#c5c8c6]%H:%M #[bg=#ad95b8,fg=#1d1f21,bold] #h "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#666666] #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-current-format "#[bg=#292c33,fg=#b7bd73,bold] #I:#W#{?window_zoomed_flag, [Z],} "
setw -g window-status-activity-style "fg=#e1c65e"
setw -g window-status-bell-style "fg=#c55757,bold"

set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#88a1bb"
set -g display-panes-active-colour "#b7bd73"
set -g display-panes-colour "#666666"

set -g message-style "bg=#1d1f21,fg=#e1c65e"
set -g message-command-style "bg=#1d1f21,fg=#e1c65e"
setw -g mode-style "bg=#e1c65e,fg=#1d1f21"
setw -g clock-mode-colour "#88a1bb"
